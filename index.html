<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FINECUTZ – Coming Soon</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--ink:#0a1426;--night:#060b16;--accent:#2a86c9;--cyan:#178f9a;--cream:#dbe8f6;--mut:#7ea1c6}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 35%,var(--ink) 0%,var(--night) 70%);color:var(--cream);
  font-family:'Outfit',sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px 16px;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(1px 1px at 20% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 70% 20%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 40% 80%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 85% 65%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 10% 70%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 60% 50%,#fff 50%,transparent 51%)}
main{position:relative;max-width:640px}
.eyebrow{font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.4em;text-transform:uppercase;color:var(--mut)}
h1{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(3.2rem,14vw,8rem);line-height:.95;letter-spacing:.02em;color:#fff;margin:18px 0 10px}
.line{width:64px;height:2px;margin:22px auto;background:linear-gradient(90deg,var(--accent),var(--cyan))}
p{font-size:1.05rem;line-height:1.6;color:var(--cream);opacity:.85}
.soon{font-family:'Space Mono',monospace;font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-top:26px}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Premium Video Editing</div>
  <h1>FINECUTZ</h1>
  <div class="line"></div>
  <p>Hier entsteht gerade etwas Neues.<br>Die Website ist bald für dich da.</p>
  <div class="soon">Coming soon</div>
</main>
</body>
</html>
